name: Weekly backup

# Every Monday at 03:00 UTC (4am in summer), May to September only.
# Calls the site, which copies all its data into the backup store and keeps
# only the newest 2 backups. "Run workflow" on the Actions tab runs it by hand.
on:
  schedule:
    - cron: "0 3 * 5-9 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Take a backup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$BACKUP_KEY" ]; then
            echo "Add the SITE_URL and BACKUP_KEY secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/api/backup" \
            -H "Content-Type: application/json" \
            -H "x-backup-key: $BACKUP_KEY" \
            -d '{"action":"run"}'
